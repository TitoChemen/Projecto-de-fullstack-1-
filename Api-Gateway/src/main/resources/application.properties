server.port=9000
spring.application.name=api-gateway

# 0. Usuario (Corregido a singular)
spring.cloud.gateway.routes[0].id=usuario-service
spring.cloud.gateway.routes[0].uri=lb://usuario-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/usuario/**

# 1. Carrito (Corregido a plural)
spring.cloud.gateway.routes[1].id=carrito-service
spring.cloud.gateway.routes[1].uri=lb://carrito-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/carritos/**

# 2. Inventario (Estaba joya)
