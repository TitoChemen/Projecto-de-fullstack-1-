# 7. Notificaciones (Estaba joya)
spring.cloud.gateway.routes[7].id=notificaciones-service
spring.cloud.gateway.routes[7].uri=lb://notificaciones-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/notificaciones/**

# Configuracion Eureka (El mapa del barrio)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/